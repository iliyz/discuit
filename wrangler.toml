name = "biscuit"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# 静态资源 + 同一 Worker 提供 API
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "biscuit-db"
database_id = "8e522098-3396-4310-91c1-9f5f81c81360"

# 环境变量说明：
# APP_TOKEN               — 访问口令（wrangler secret put APP_TOKEN）
# AZURE_TRANSLATOR_KEY    — Azure AI Translator F0 密钥（wrangler secret put）
# AZURE_TRANSLATOR_REGION — Azure 资源区域，如 eastasia（非机密，放 vars）
# BAIDU_APPID             — 百度翻译 APPID（可选备胎，留空跳过）
# BAIDU_SECRET            — 百度翻译密钥（wrangler secret put）
[vars]
AZURE_TRANSLATOR_REGION = "eastasia"
BAIDU_APPID = ""
